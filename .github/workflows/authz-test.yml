# File: .github/workflows/authz-test.yml
name: Authorization Service Go Tests

on:
  push:
    branches:
      - master
    paths:
      - 'services/authorization/go/**'
      - '.github/workflows/authz-test.yml'
  pull_request:
    branches:
      - master
    paths:
      - 'services/authorization/go/**'
      - '.github/workflows/authz-test.yml'

jobs:
  test-authz:
    name: Run Go Unit Tests (authz)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.8'
          cache: true
          cache-dependency-path: services/authorization/go/go.sum

      - name: Run Go Tests for authz package
        working-directory: ./services/authorization/go
        run: |
          echo "Ensuring module dependencies are tidy..."
          go mod tidy -v
          echo "Running tests specifically for the authz package..."
          go test -v -count=1 ./authz
