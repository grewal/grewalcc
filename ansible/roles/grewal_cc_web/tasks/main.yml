---
# ansible/roles/grewal_cc_web/tasks/main.yml

- name: Pull the specified grewal-cc-web Docker image
  community.docker.docker_image:
    name: "{{ grewal_cc_web_image_repository }}:{{ grewal_cc_web_image_tag }}"
    source: pull
  become: yes
  tags:
    - grewal_cc_web

- name: Ensure grewal-cc-web container is running with correct internal URLs and secrets
  community.docker.docker_container:
    name: "{{ grewal_cc_web_container_name }}"
    image: "{{ grewal_cc_web_image_repository }}:{{ grewal_cc_web_image_tag }}"
    state: started
    pull: false
    recreate: true
    restart_policy: always
    networks:
      - name: "{{ docker_network_name }}"
    ports:
      # Port is only published to loopback for Consul health checks
      - "127.0.0.1:{{ grewal_cc_web_host_health_check_port }}:{{ grewal_cc_web_container_port }}"
    labels:
      service: "grewal-cc-web"
      project: "grewal.cc"
    env:
      # Use internal Docker DNS names for service-to-service communication
      AUTH_SERVICE_URL: "http://auth-service:{{ auth_service_container_port }}"
      BACKEND_GRPC_URL: "grewalcc:{{ grewalcc_container_port }}"
      
      # --- CRITICAL JWT SECRETS ---
      AUTH_SERVICE_JWT_PRIVATE_KEY_PEM: "{{ auth_service_jwt_private_key_pem_vault }}"
      AUTH_SERVICE_JWT_PUBLIC_KEY_PEM: "{{ auth_service_jwt_public_key_pem_vault }}"
      
      # --- OTHER VARS ---
      APP_URL: "{{ CANONICAL_APP_URL | default('https://grewal.cc') }}"
      NEXT_PUBLIC_APP_URL: "{{ CANONICAL_APP_URL | default('https://grewal.cc') }}"
      NODE_ENV: "production"
  become: yes
  tags:
    - grewal_cc_web

- name: Deploy grewal-cc-web Consul service definition
  ansible.builtin.template:
    src: grewal-cc-web.hcl.j2
    dest: "/etc/consul.d/grewal-cc-web-service.hcl"
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: Reload Consul Configuration
  tags:
    - grewal_cc_web
