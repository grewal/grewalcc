---
# ansible/roles/web_grewal_cc_web/tasks/main.yml
- name: "Ensure {{ grewal_cc_web_container_name }} container is running"
  community.docker.docker_container:
    name: "{{ grewal_cc_web_container_name }}"
    image: "{{ grewal_cc_web_image_repository }}:{{ grewal_cc_web_image_tag }}"
    state: started
    pull: true
    recreate: true
    restart_policy: always
    networks:
      - name: "{{ docker_network_name }}"
    ports:
      - "127.0.0.1:{{ grewal_cc_web_host_health_check_port }}:{{ grewal_cc_web_container_port }}"
    labels:
      service: "grewal-cc-web"
      project: "grewal.cc"
    env:
      AUTH_SERVICE_URL: "https://grewal.cc"
      BACKEND_GRPC_URL: "https://grewal.cc"
      APP_URL: "{{ CANONICAL_APP_URL }}"
      NEXT_PUBLIC_APP_URL: "{{ CANONICAL_APP_URL }}"
      NODE_ENV: "production"
      DEBUG_ENV_VARS: "true"
  register: grewal_cc_web_container_info
  tags:
    - grewal_cc_web

- name: Deploy grewal-cc-web Consul service definition
  ansible.builtin.template:
    src: grewal-cc-web.hcl.j2
    dest: "/etc/consul.d/grewal-cc-web-service.hcl"
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: Reload Consul Configuration
  tags:
    - grewal_cc_web
