# FILE: roles/redis/tasks/main.yml
---
# tasks file for redis role

# Task 1: Ensure host directory exists
- name: Ensure Redis host data directory exists
  ansible.builtin.file:
    path: "{{ redis_data_dir_host }}"
    state: directory
    owner: nobody
    group: nogroup
    mode: '0755'
  become: yes

# Task 2: Ensure Redis container is running using docker_container
- name: Ensure Redis container is running (with AOF Persistence and Memory Limits)
  community.docker.docker_container:
    # --- Container Identification ---
    name: "{{ redis_container_name }}"
    image: "{{ redis_image_repository }}:{{ redis_image_tag }}"

    # --- State Management ---
    state: started
    pull: true
    recreate: true
    restart_policy: always
    networks:
      - name: "grewalnet"
    timeout: 120

    # --- Resource Limits ---
    memory: "125m"

    # --- Container Configuration ---
    entrypoint: /usr/local/bin/redis-server

    # --- Command with AOF Persistence, Memory Limits, and Eviction Policy ---
    command:
      - "--save"
      - ""
      - "--appendonly"
      - "yes"
      - "--requirepass"
      - "{{ redis_password }}"
      - "--maxmemory"
      - "100mb"
      - "--maxmemory-policy"
      - "allkeys-lru"

    ports:
      - "127.0.0.1:{{ redis_port | default(6379) }}:{{ redis_port | default(6379) }}"

    # --- Volumes for Persistence ENABLED ---
    volumes:
      - "{{ redis_data_dir_host }}:/data"

    labels:
      service: redis
      managed_by: ansible

  become: yes
  register: redis_container_result

# Task 3: Show if the container state changed
- name: Show Redis container result status
  ansible.builtin.debug:
    msg: "Redis container status: {{ 'Changed/Recreated' if redis_container_result.changed else 'Unchanged/Already Running' }}"
  when: redis_container_result is defined

# Task 4: Deploy Consul service definition for Redis
- name: Deploy Consul service definition for Redis
  ansible.builtin.template:
    src: redis-service.hcl.j2
    dest: "/etc/consul.d/redis-service.hcl"
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: Restart consul service
