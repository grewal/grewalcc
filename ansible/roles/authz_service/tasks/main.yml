# Corrected: ansible/roles/authz_service/tasks/main.yml
---
- name: Ensure BPF map pinning directory exists
  ansible.builtin.file:
    path: "{{ authz_service_xdp_map_root_path | default('/sys/fs/bpf/grewalcc') }}"
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: yes
  tags:
    - ebpf_setup

- name: Deploy Consul HTTP service definition for authz-service
  ansible.builtin.template:
    src: authz-service-http.hcl.j2
    dest: "/etc/consul.d/authz-service-http.hcl"
    owner: root # Should be root, as consul container reads it.
    group: root
    mode: '0644'
  become: yes
  notify: Reload Consul Configuration

- name: Deploy Consul gRPC service definition for authz-service
  ansible.builtin.template:
    src: authz-service-grpc.hcl.j2
    dest: "/etc/consul.d/authz-service-grpc.hcl"
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: Reload Consul Configuration

- name: Ensure authz-service container is running
  community.docker.docker_container:
    name: authz-service
    image: "grewal/authz-service:{{ authz_service_image_tag }}"
    state: started
    pull: true
    recreate: true # Ensures changes to capabilities, env, etc., are applied
    network_mode: host
    restart_policy: always
    env:
      CONSUL_HTTP_ADDR: "127.0.0.1:{{ consul_http_port | default(8500) }}" # Use loopback for host network
      HTTP_LISTEN_ADDR: ":{{ authz_service_http_port | default(9001) }}"
      GRPC_LISTEN_ADDR: ":{{ authz_service_grpc_port | default(9002) }}"
      REDIS_ADDR: "127.0.0.1:{{ redis_port | default(6379) }}"
      REDIS_PASSWORD: "{{ redis_password }}"
      LOG_LEVEL: "{{ authz_service_log_level | default('INFO') }}"
      XDP_INTERFACE_NAME: "{{ authz_service_xdp_interface | default('ens4') }}"
      # The rest of your XDP env vars are correct...
      XDP_OBJECT_PATH: "{{ authz_service_xdp_object_path | default('/app/ebpf/kernel/xdp_ip_blocker.o') }}"
      XDP_MAP_ROOT_PATH: "{{ authz_service_xdp_map_root_path | default('/sys/fs/bpf/grewalcc') }}"
      XDP_IP_BLOCKLIST_MAP_NAME: "{{ authz_service_xdp_ip_blocklist_map_name | default('ip_blocklist_map') }}"
    labels:
      service: authz-service
      managed_by: ansible
    
    # --- THIS IS THE KEY FIX ---
    privileged: false  # Explicitly set to false.
    capabilities:
      # Use SYS_ADMIN as it's recognized and covers BPF/PERFMON.
      - SYS_ADMIN
      # Still need NET_ADMIN for XDP program attachment to a network interface.
      - NET_ADMIN
      # Required for locking memory for BPF maps.
      - IPC_LOCK
    
    volumes:
      # This mount is correct for giving the container access to the BPF filesystem.
      - /sys/fs/bpf:/sys/fs/bpf:rshared
  become: no
