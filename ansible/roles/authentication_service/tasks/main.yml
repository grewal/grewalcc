# ansible/roles/authentication_service/tasks/main.yml

- name: Ensure grewal.cc network exists
  community.docker.docker_network:
    name: "{{ docker_network_name }}"
    state: present

- name: Pull the latest auth-service image
  community.docker.docker_image:
    name: "{{ auth_service_image_repository }}:{{ auth_service_image_tag }}"
    source: pull

- name: Build DATABASE_URL with explicit string formatting and encoding
  ansible.builtin.set_fact:
    auth_service_database_url: >-
      postgresql://{{ postgres_user_vault | urlencode }}:{{ postgres_password_vault | urlencode }}@postgres-server:{{ postgres_port | string }}/{{ postgres_db_name_vault }}

- name: Ensure auth-service container is running
  community.docker.docker_container:
    name: "{{ auth_service_container_name }}"
    image: "{{ auth_service_image_repository }}:{{ auth_service_image_tag }}"
    pull: false
    state: started
    restart_policy: always
    network_mode: "{{ docker_network_name }}"
    ports:
      - "{{ auth_service_host_port }}:{{ auth_service_container_port }}"
    env:
      RUST_LOG: "{{ auth_service_log_level }}"
      APP_HOST: "{{ auth_service_host_ip }}"
      APP_PORT: "{{ auth_service_container_port | string }}"
      DATABASE_URL: "{{ auth_service_database_url }}" 
      AUTH_SERVICE_JWT_PRIVATE_KEY_PEM: "{{ auth_service_jwt_private_key_pem_vault }}"
      AUTH_SERVICE_JWT_PUBLIC_KEY_PEM: "{{ auth_service_jwt_public_key_pem_vault }}"
      AUTH_SERVICE_JWT_ACCESS_TOKEN_EXPIRES_IN_SECONDS: "{{ auth_service_jwt_access_token_expires_in_seconds_vault }}"
      AUTH_SERVICE_JWT_ALGORITHM: "{{ auth_service_jwt_algorithm_vault }}"
    labels:
      service: "auth-service"
      project: "grewal.cc"

- name: Deploy auth-service Consul service definition
  ansible.builtin.template:
    src: auth-service.hcl.j2
    dest: /etc/consul.d/auth-service.hcl
    owner: root
    group: root
    mode: '0644'
  notify: Reload Consul Configuration
