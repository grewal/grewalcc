---
# tasks file for postgres

- name: Pull the specified PostgreSQL Docker image to ensure it is up-to-date
  community.docker.docker_image:
    name: "{{ postgres_image_name }}:{{ postgres_image_tag }}"
    source: pull
  become: yes
  tags:
    - postgres

- name: Ensure PostgreSQL host data directory exists
  ansible.builtin.file:
    path: "{{ postgres_host_data_path }}"
    state: directory
    owner: '999'
    group: '999'
    mode: '0700'
  become: yes
  tags:
    - postgres

- name: Ensure PostgreSQL container is running
  community.docker.docker_container:
    name: "{{ postgres_container_name }}"
    image: "{{ postgres_image_name }}:{{ postgres_image_tag }}"
    state: started
    restart_policy: always
    recreate: true
    networks:
      - name: "{{ postgres_docker_network }}"
    env:
      POSTGRES_PASSWORD: "{{ postgres_password_vault }}"
      POSTGRES_USER: "{{ postgres_user_vault }}"
      POSTGRES_DB: "{{ postgres_db_name_vault }}"
    volumes:
      - "{{ postgres_host_data_path }}:/var/lib/postgresql/data"
    ports:
      - "127.0.0.1:{{ postgres_host_published_port }}:{{ postgres_container_port }}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ postgres_user }} -d {{ postgres_db_name }} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
  become: yes
  tags:
    - postgres

- name: Deploy Consul service definition for PostgreSQL
  ansible.builtin.template:
    src: postgres-service.hcl.j2
    dest: "/etc/consul.d/postgres-service.hcl"
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: Reload Consul Configuration
  tags:
    - postgres
