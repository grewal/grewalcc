---
# tasks file for postgres
- name: Ensure PostgreSQL host data directory exists
  ansible.builtin.file:
    path: "{{ postgres_host_data_path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags:
    - postgres

- name: Ensure PostgreSQL container is running
  community.docker.docker_container:
    name: "{{ postgres_container_name }}"
    image: "{{ postgres_image_name }}:{{ postgres_image_tag }}"
    state: started
    restart_policy: always
    pull: true
    networks:
      - name: "{{ postgres_docker_network }}"
    env:
      POSTGRES_PASSWORD: "{{ postgres_password_vault }}"
      POSTGRES_USER: "{{ postgres_user_vault }}"
      POSTGRES_DB: "{{ postgres_db_name_vault }}"
    volumes:
      - "{{ postgres_host_data_path }}:/var/lib/postgresql/data"
    ports:
      - "127.0.0.1:{{ postgres_host_published_port }}:{{ postgres_container_port }}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U {{ postgres_user }} -d {{ postgres_db_name }}"]
      interval: 10s
      timeout: 5s
      retries: 5
  tags:
    - postgres
