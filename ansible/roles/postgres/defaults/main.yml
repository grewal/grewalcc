---
postgres_image_name: "postgres"
postgres_image_tag: "17.5-alpine"
postgres_container_name: "postgres"
postgres_host_data_path: "/opt/postgres/data"
postgres_backup_dir: "/opt/postgres/backups"
postgres_backup_script_path: "/usr/local/bin/backup_postgres.sh"
postgres_host_published_port: 5432
postgres_container_port: 5432
postgres_docker_network: "{{ docker_network_name }}"
postgres_consul_service_name: "postgres"
postgres_consul_service_id: "postgres-server-main"
postgres_consul_health_check_interval: "10s"
postgres_consul_health_check_timeout: "5s"
postgres_consul_tags:
  - "database"
  - "postgresql"
  - "grewal.cc"
postgres_backup_schedule_minute: "0"
postgres_backup_schedule_hour: "3"
postgres_backup_gcs_bucket: "{{ gcp_project_id }}-postgres-backups"

# Non-vault versions for healthcheck and other non-sensitive operations
postgres_user: "{{ postgres_user_vault }}"
postgres_db_name: "{{ postgres_db_name_vault }}"
