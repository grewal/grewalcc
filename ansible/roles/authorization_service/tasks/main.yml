---
# ansible/roles/authorization_service/tasks/main.yml

- name: Pull the specified authz-service Docker image
  community.docker.docker_image:
    name: "{{ authz_service_image_repository }}:{{ authz_service_image_tag }}"
    source: pull
  become: yes
  tags:
    - authorization_service

- name: Ensure BPF filesystem is mounted persistently
  ansible.posix.mount:
    path: /sys/fs/bpf
    src: bpf
    fstype: bpf
    opts: defaults
    state: mounted
  become: yes
  tags:
    - authorization_service

- name: Deploy Consul service definitions for authz-service
  ansible.builtin.template:
    src: "{{ item }}.hcl.j2"
    dest: "/etc/consul.d/{{ item }}.hcl"
    owner: root
    group: root
    mode: '0644'
  loop:
    - authz-service-http
    - authz-service-grpc
  become: yes
  notify: Restart consul service
  tags:
    - authorization_service

- name: Ensure authz-service container is running securely on the HOST network
  community.docker.docker_container:
    name: authz-service
    image: "{{ authz_service_image_repository }}:{{ authz_service_image_tag }}"
    state: started
    pull: false
    recreate: true
    restart_policy: always

    # --- Security & Permissions ---
    privileged: true # for BPF Filesystem access
    capabilities:
      - SYS_ADMIN   # Required for BPF/XDP operations
      - NET_ADMIN   # Required for attaching programs to network interfaces
      - IPC_LOCK    # Required for locking memory for BPF maps

    # --- Networking ---
    # This service REQUIRES host networking to access the physical NIC for XDP.
    network_mode: host

    env:
      # Now that it's on the host network, it accesses other services via 127.0.0.1
      CONSUL_HTTP_ADDR: "127.0.0.1:{{ consul_http_port | default(8500) }}"
      REDIS_ADDR: "127.0.0.1:{{ redis_port | default(6379) }}"
      REDIS_PASSWORD: "{{ redis_password }}"

      HTTP_LISTEN_ADDR: ":{{ authz_service_http_port_container | default(9001) }}"
      GRPC_LISTEN_ADDR: ":{{ authz_service_grpc_port_container | default(9002) }}"

      LOG_LEVEL: "{{ authz_service_log_level | default('INFO') }}"
      XDP_GLOBAL_ENABLED: "true"
      XDP_INTERFACE_NAME: "{{ authz_service_xdp_interface | default('ens4') }}"
      XDP_OBJECT_PATH: "{{ authz_service_xdp_object_path | default('/app/ebpf/kernel/xdp_ip_blocker.o') }}"
      XDP_MAP_ROOT_PATH: "{{ authz_service_xdp_map_root_path | default('/sys/fs/bpf/grewalcc') }}"

    volumes:
      - /sys/fs/bpf:/sys/fs/bpf:rshared

    labels:
      service: authz-service
      managed_by: ansible

  become: yes
  tags:
    - authorization_service
