# FILE: ansible/roles/authorization_service/tasks/main.yml

---
- name: Pull the specified authz-service Docker image
  community.docker.docker_image:
    name: "{{ authz_service_image_repository }}:{{ authz_service_image_tag }}"
    source: pull
  become: yes

- name: Ensure BPF filesystem is mounted persistently
  ansible.posix.mount:
    path: /sys/fs/bpf
    src: none
    fstype: bpf
    opts: mode=0755
    state: mounted
  become: yes

- name: Create BPF pin directory for authz-service
  ansible.builtin.file:
    path: /sys/fs/bpf/grewalcc
    state: directory
    mode: '0755'
    owner: root
    group: root
  become: yes

- name: Deploy Consul service definitions for authz-service
  ansible.builtin.template:
    src: "{{ item }}.hcl.j2"
    dest: "/etc/consul.d/{{ item }}.hcl"
    owner: root
    group: root
    mode: '0644'
  loop:
    - authz-service-http
    - authz-service-grpc
  become: yes
  notify: Reload Consul Configuration

- name: Stop existing authz-service container if running
  community.docker.docker_container:
    name: authz-service
    state: absent
  become: yes
  ignore_errors: yes

- name: Start authz-service container with XDP firewall disabled
  ansible.builtin.shell: |
    docker run -d \
      --name authz-service \
      --restart always \
      --network host \
      --privileged \
      --security-opt seccomp=unconfined \
      --security-opt apparmor=unconfined \
      --cap-add=SYS_ADMIN \
      --cap-add=NET_ADMIN \
      --cap-add=SYS_RESOURCE \
      --cap-add=IPC_LOCK \
      --ulimit memlock=-1:-1 \
      -v /sys/fs/bpf:/sys/fs/bpf \
      -e VALKEY_ADDR="{{ authz_env.VALKEY_ADDR }}" \
      -e CONSUL_ADDR="{{ authz_env.CONSUL_ADDR }}" \
      -e VALKEY_PASSWORD="{{ authz_env.VALKEY_PASSWORD }}" \
      -e SKIP_XDP_FIREWALL="true" \
      --label service=authz-service \
      --label managed_by=ansible \
      {{ authz_service_image_repository }}:{{ authz_service_image_tag }}
  become: yes
  register: docker_run_result
  changed_when: docker_run_result.rc == 0
