---
# ansible/roles/web/tasks/main.yml

- name: Pull the latest Next.js web application image
  community.docker.docker_image:
    name: "{{ web_image_repository }}:{{ web_image_tag }}"
    source: pull
  become: yes

- name: Ensure Next.js web application container is running
  community.docker.docker_container:
    name: "{{ web_container_name }}"
    image: "{{ web_image_repository }}:{{ web_image_tag }}"
    state: started
    recreate: true
    restart_policy: always
    networks:
      - name: "{{ docker_network_name }}"
    labels:
      service: "grewal-cc-web"
      project: "grewal.cc"
  become: yes
  notify: Reload Consul Configuration
  register: web_container_info

- name: Deploy Consul service definition for the web application
  ansible.builtin.template:
    src: web-service.hcl.j2
    dest: "/etc/consul.d/web-service.hcl"
    owner: root
    group: root
    mode: '0644'
  become: yes
  notify: Reload Consul Configuration
