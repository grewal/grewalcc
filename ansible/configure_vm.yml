# FILE: ansible/configure_vm.yml
---
- name: Configure gcc-gem-a VM
  hosts: gcc-gem-a
  become: yes

  vars_files:
    - vars/secrets.yml

  vars:
    valkey_bind_address: "127.0.0.1"
    valkey_port: 6379
    consul_host_ip: "10.128.0.22"
    consul_http_port: 8500

  pre_tasks:
    - name: Ensure grewalnet Docker network exists
      community.docker.docker_network:
        name: grewalnet
        driver: bridge
      tags: [always]

    - name: Ensure rsync is installed for synchronize module
      ansible.builtin.package:
        name: rsync
        state: present
      tags: [always]

    # VALIDATION: Fail fast if critical secrets are missing
    - name: Validate that Valkey password is defined
      ansible.builtin.assert:
        that:
          - valkey_password is defined
          - valkey_password | length > 0
        fail_msg: "CRITICAL: valkey_password must be defined in vars/secrets.yml and cannot be empty"
        success_msg: "Valkey password is properly configured"
      tags: [always]

    - name: Compute container env map for authorization_service
      ansible.builtin.set_fact:
        authz_env:
          VALKEY_ADDR: "{{ valkey_bind_address }}:{{ valkey_port }}"
          CONSUL_ADDR: "{{ consul_host_ip }}:{{ consul_http_port }}"
          VALKEY_PASSWORD: "{{ valkey_password }}"
      tags: [always]

    # DEBUG: enable to verify environment variables
    - name: Debug authz_env for verification
      ansible.builtin.debug:
        msg:
          - "VALKEY_ADDR: {{ authz_env.VALKEY_ADDR }}"
          - "CONSUL_ADDR: {{ authz_env.CONSUL_ADDR }}"
          - "VALKEY_PASSWORD: {{ 'SET (hidden)' if authz_env.VALKEY_PASSWORD else 'NOT SET' }}"
      tags: [always]

  tasks:
    - name: Ensure GCE workload cert refresh override directory exists
      ansible.builtin.file:
        path: /etc/systemd/system/gce-workload-cert-refresh.service.d
        state: directory
        owner: root
        group: root
        mode: '0755'
      tags: [always]

    - name: Throttle GCE workload certificate refresh service
      ansible.builtin.copy:
        dest: /etc/systemd/system/gce-workload-cert-refresh.service.d/override.conf
        content: "{{ gce_cert_refresh_override_content }}"
        owner: root
        group: root
        mode: '0644'
      notify:
        - Reload systemd daemon
        - Restart gce-workload-cert-refresh timer
      tags: [always]

    - name: Apply Host Optimizations
      block:
        - name: Set vm.overcommit_memory for Valkey/Redis
          ansible.builtin.copy:
            src: 99-grewalcc-redis-kernel-custom.conf
            dest: /etc/sysctl.d/99-grewalcc-kernel-custom.conf
            owner: root
            group: root
            mode: '0644'
          notify: Apply sysctl
        - name: Disable Transparent Huge Pages (THP) for Valkey/Redis
          ansible.builtin.lineinfile:
            path: /etc/rc.local
            regexp: '^echo never > /sys/kernel/mm/transparent_hugepage/enabled'
            line: 'echo never > /sys/kernel/mm/transparent_hugepage/enabled'
            create: yes
            owner: root
            group: root
            mode: '0755'
          notify: Apply THP now
      tags: [always]

  roles:
    - role: consul
      tags: ['consul']
    - role: valkey
      tags: ['valkey']
    #- role: redis
      #tags: ['redis']
    - role: authorization_service
      tags: ['authorization_service']
    - role: authentication_service
      tags: ['authentication_service']
    - role: grewalcc
      tags: ['grewalcc']
    - role: grewal_cc_web
      tags: ['grewal_cc_web']
    - role: xds-adapter
      tags: ['xds-adapter', 'envoy']
    - role: envoy
      tags: ['envoy']

  handlers:
    - name: Apply sysctl
      ansible.builtin.command: sysctl -p /etc/sysctl.d/99-grewalcc-kernel-custom.conf
      become: yes
    - name: Apply THP now
      ansible.builtin.command: echo never > /sys/kernel/mm/transparent_hugepage/enabled
      become: yes
    - name: Reload Consul Configuration
      listen: "Reload Consul Configuration"
      ansible.builtin.command: "docker exec consul consul reload"
      changed_when: true
      become: yes
    - name: Restart consul service
      listen: "Restart consul service"
      ansible.builtin.systemd:
        name: consul.service
        state: restarted
      become: yes
    - name: Restart prometheus service
      listen: "Restart prometheus service"
      ansible.builtin.systemd:
        name: prometheus.service
        state: restarted
      become: yes
    - name: Restart envoy service
      listen: "Restart envoy service"
      ansible.builtin.systemd:
        name: envoy.service
        state: restarted
      become: yes
    - name: Restart xds-adapter service
      listen: "Restart xds-adapter service"
      ansible.builtin.systemd:
        name: xds-adapter.service
        state: restarted
      become: yes
    - name: Reload systemd daemon
      ansible.builtin.systemd:
        daemon_reload: yes
      become: yes
    - name: Restart gce-workload-cert-refresh timer
      ansible.builtin.systemd:
        name: gce-workload-cert-refresh.timer
        state: restarted
      become: yes
