[package]
name = "authentication"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7" # Using 0.7.x series for stability, Cargo will pick latest patch
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For PostgreSQL
sqlx = { version = "0.7", features = [ "runtime-tokio-rustls", "postgres", "uuid", "chrono", "json" ] }

# For time and JWT claims
chrono = { version = "0.4", features = ["serde"] }

# For JWTs
jsonwebtoken = "9" # Using version 9.x.x

# For password hashing
argon2 = "0.5"
secrecy = { version = "0.8", features = ["serde"] } # For handling passwords securely

# For UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# For error handling
thiserror = "1.0"
anyhow = "1.0"

# For logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# For Consul KV client
consulrs = "0.1" # A modern async Consul client

# For Redis client
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# For loading .env files during local development
dotenvy = "0.15"

# For RSA key generation/handling for JWKS (needed for RS256 signing)
rsa = "0.9"
rand = "0.8"
base64 = "0.22"
