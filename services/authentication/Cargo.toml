[package]
name = "authentication"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] } # Async runtime
axum = "0.7"                                   # Web framework
serde = { version = "1.0", features = ["derive"] } # Serialization/Deserialization
serde_json = "1.0"                             # JSON support for Serde

sqlx = { version = "0.7", features = [ "runtime-tokio-rustls", "postgres", "uuid", "chrono", "json" ] } 
chrono = { version = "0.4", features = ["serde"] } # Timestamps
jsonwebtoken = "9"                             # JWT creation/validation
argon2 = "0.5"                                 # Password hashing
secrecy = { version = "0.8", features = ["serde"] } # handling secret values

uuid = { version = "1", features = ["v4", "serde"] } # UUID generation

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# JWKS key generation and representation
rsa = "0.9"
rand = "0.8"
base64 = "0.22" # base64url encoding parts of JWKS/JWT

dotenvy = "0.15"
