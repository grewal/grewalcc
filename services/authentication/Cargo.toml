[package]
name = "authentication"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["full"] } # Async runtime
axum = "0.7"                                   # Web framework
serde = { version = "1.0", features = ["derive"] } # Serialization/Deserialization
serde_json = "1.0"                             # JSON support for Serde

sqlx = { version = "0.7", features = [ "runtime-tokio-rustls", "postgres", "uuid", "chrono", "json" ] } # Async SQL, ensure features match your needs
chrono = { version = "0.4", features = ["serde"] } # Timestamps
jsonwebtoken = "9"                             # JWT creation/validation
argon2 = "0.5"                                 # Password hashing
secrecy = { version = "0.8", features = ["serde"] } # For handling secret values like passwords

uuid = { version = "1", features = ["v4", "serde"] } # UUID generation

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Consul KV (check crates.io for the best current actively maintained one, `consulrs` is an option)
# For now, let's assume a placeholder or we'll add it when we implement KV logic.
# consulrs = "0.6" # Example

# Redis
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Configuration - for reading .env files or similar if needed
# dotenvy = "0.15" # Optional: for loading .env files for local dev

# For JWKS key generation and representation (might need these or similar)
rsa = "0.9"
rand = "0.8"
base64 = "0.22" # For base64url encoding parts of JWKS/JWT if needed manually

# For .env file handling for local development secrets
dotenvy = "0.15"
