[package]
name = "authentication_service" # CORRECTED from "authentication"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# For time, JWT claims, and general timestamping
chrono = { version = "0.4", features = ["serde"] }

# For JWT creation/validation
jsonwebtoken = "9" # Using version 9.x.x

# For password hashing
argon2 = "0.5"
secrecy = { version = "0.8", features = ["serde"] }

# For UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# For error handling
thiserror = "1.0"
anyhow = "1.0"

# For logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }

# For Consul KV client
consulrs = "0.1" # A modern async Consul client

# For Redis client
redis = { version = "0.26.0", features = ["tokio-comp", "connection-manager"] }

# For loading .env files during local development
dotenvy = "0.15"

# For RSA key generation/handling for JWKS (needed for RS256 signing)
rsa = "0.9"
rand = "0.8"
base64 = "0.22" # For base64url encoding parts of JWKS/JWT

validator = { version = "0.18", features = ["derive"] }
lazy_static = "1.4.0"
regex = "1"

once_cell="1.19"
