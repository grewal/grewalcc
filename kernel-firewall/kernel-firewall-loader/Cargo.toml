[package]
name = "kernel-firewall-loader"
version = "0.25.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
libbpf-rs = "0.24"
libc = "0.2"
nix = { version = "0.29", features = ["net", "sched", "process"] }
kernel-firewall-common = { path = "../kernel-firewall-common" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
